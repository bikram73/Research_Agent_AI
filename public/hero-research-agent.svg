<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background and Glow Filters -->
    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow-card" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#002166" flood-opacity="0.14" />
    </filter>
    <filter id="shadow-core" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#004AC1" flood-opacity="0.3" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004AC1" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#004AC1" />
    </linearGradient>

    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F3FF" />
    </linearGradient>

    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>

    <radialGradient id="ambient-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#004AC1" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004AC1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.3" />
    </linearGradient>
  </defs>

  <!-- Ambient Background Glow -->
  <circle cx="400" cy="400" r="320" fill="url(#ambient-core)" />

  <!-- Orbital Geometric Rings -->
  <g opacity="0.65">
    <!-- Outer dashed orbit -->
    <ellipse cx="400" cy="400" rx="330" ry="190" stroke="#004AC1" stroke-width="1.5" stroke-dasharray="6 8" transform="rotate(-15 400 400)" />
    <!-- Secondary tilted orbit -->
    <ellipse cx="400" cy="400" rx="270" ry="150" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.5" transform="rotate(25 400 400)" />
    <!-- Inner orbital ring -->
    <ellipse cx="400" cy="400" rx="210" ry="115" stroke="url(#ring-grad)" stroke-width="2" transform="rotate(-5 400 400)" />
  </g>

  <!-- Constellation Nodes & Connecting Synaptic Lines -->
  <g opacity="0.6">
    <line x1="400" y1="400" x2="190" y2="240" stroke="#004AC1" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="400" y1="400" x2="610" y2="230" stroke="#2563EB" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="400" y1="400" x2="210" y2="570" stroke="#7C3AED" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="400" y1="400" x2="600" y2="560" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="190" y1="240" x2="310" y2="150" stroke="#93C5FD" stroke-width="1.5" />
    <line x1="610" y1="230" x2="520" y2="140" stroke="#C4B5FD" stroke-width="1.5" />
  </g>

  <!-- Glowing Data Particle Dots on Orbits -->
  <g filter="url(#glow-subtle)">
    <circle cx="280" cy="275" r="4.5" fill="#004AC1" />
    <circle cx="530" cy="300" r="5" fill="#2563EB" />
    <circle cx="510" cy="495" r="4" fill="#7C3AED" />
    <circle cx="270" cy="480" r="5.5" fill="#38BDF8" />
    <circle cx="400" cy="210" r="4" fill="#004AC1" />
    <circle cx="400" cy="590" r="4" fill="#10B981" />
  </g>

  <!-- TOP-LEFT FLOATING CARD: Research Document Ingestion -->
  <g filter="url(#shadow-card)" transform="translate(90, 160)">
    <rect width="210" height="150" rx="16" fill="url(#card-grad-1)" stroke="#C7D2FE" stroke-width="1.5" />
    <!-- Header bar -->
    <rect x="0" y="0" width="210" height="38" rx="16" fill="#F8FAFC" />
    <path d="M0 26 h210 v12 H0 z" fill="#F8FAFC" />
    <circle cx="24" cy="19" r="6" fill="#EF4444" />
    <circle cx="40" cy="19" r="6" fill="#F59E0B" />
    <circle cx="56" cy="19" r="6" fill="#10B981" />
    <rect x="130" y="12" width="64" height="14" rx="7" fill="#E0E7FF" />
    <text x="162" y="22" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" fill="#004AC1" text-anchor="middle">PDF · DOCX</text>
    
    <!-- Document Contents Representation -->
    <rect x="20" y="52" width="85" height="10" rx="4" fill="#004AC1" opacity="0.8" />
    <rect x="20" y="70" width="170" height="6" rx="3" fill="#94A3B8" opacity="0.6" />
    <rect x="20" y="82" width="150" height="6" rx="3" fill="#94A3B8" opacity="0.4" />
    <rect x="20" y="94" width="165" height="6" rx="3" fill="#94A3B8" opacity="0.4" />
    
    <!-- Badge tag -->
    <rect x="20" y="114" width="95" height="20" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1" />
    <circle cx="30" cy="124" r="3.5" fill="#004AC1" />
    <text x="70" y="127" font-family="'Work Sans', sans-serif" font-size="10" font-weight="700" fill="#004AC1" text-anchor="middle">Quantum_Res.pdf</text>
  </g>

  <!-- TOP-RIGHT FLOATING CARD: Semantic Citation Graph -->
  <g filter="url(#shadow-card)" transform="translate(500, 150)">
    <rect width="210" height="155" rx="16" fill="url(#card-grad-2)" stroke="#BFDBFE" stroke-width="1.5" />
    <!-- Header -->
    <rect x="0" y="0" width="210" height="38" rx="16" fill="#F0FDF4" />
    <path d="M0 26 h210 v12 H0 z" fill="#F0FDF4" />
    <circle cx="22" cy="19" r="6" fill="#10B981" />
    <text x="34" y="23" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#059669">EVIDENCE MATCH</text>
    <rect x="150" y="11" width="46" height="16" rx="8" fill="#DCFCE7" />
    <text x="173" y="22" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#15803D" text-anchor="middle">99.4%</text>

    <!-- Citation item -->
    <rect x="18" y="50" width="174" height="42" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" />
    <text x="28" y="66" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#004AC1">[Source 1: Page 14]</text>
    <text x="28" y="82" font-family="'Work Sans', sans-serif" font-size="9" fill="#475569">"Verified entanglement limit..."</text>

    <!-- Mini Progress Bars -->
    <rect x="18" y="106" width="174" height="6" rx="3" fill="#E2E8F0" />
    <rect x="18" y="106" width="158" height="6" rx="3" fill="url(#cyan-blue)" />
    <text x="18" y="126" font-family="'Work Sans', sans-serif" font-size="9.5" font-weight="600" fill="#64748B">Strict Grounding Active</text>
    <circle cx="186" cy="123" r="4" fill="#10B981" />
  </g>

  <!-- BOTTOM-LEFT FLOATING CARD: Anti-Hallucination Shield -->
  <g filter="url(#shadow-card)" transform="translate(100, 480)">
    <rect width="200" height="130" rx="16" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5" />
    <circle cx="36" cy="36" r="16" fill="#EDE9FE" />
    <path d="M36 26 L45 30 L45 37 C45 42 41 46 36 48 C31 46 27 42 27 37 L27 30 Z" fill="#7C3AED" />
    <path d="M33 37 L35 39 L40 34" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="62" y="34" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#1E1B4B">Zero Hallucination</text>
    <text x="62" y="48" font-family="'Work Sans', sans-serif" font-size="10" fill="#6B7280">Multi-Agent Guardrails</text>

    <line x1="20" y1="68" x2="180" y2="68" stroke="#F3F4F6" stroke-width="1" />

    <rect x="20" y="80" width="160" height="24" rx="8" fill="#F5F3FF" />
    <text x="100" y="96" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#7C3AED" text-anchor="middle">Cosine Sim &gt; 0.88</text>
  </g>

  <!-- BOTTOM-RIGHT FLOATING CARD: Synthesis Engine -->
  <g filter="url(#shadow-card)" transform="translate(500, 475)">
    <rect width="210" height="135" rx="16" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="1.5" />
    <!-- Header -->
    <rect x="18" y="16" width="30" height="30" rx="8" fill="#E0F2FE" />
    <circle cx="33" cy="31" r="7" stroke="#0284C7" stroke-width="2" />
    <line x1="38" y1="36" x2="44" y2="42" stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" />
    
    <text x="56" y="28" font-family="'Manrope', sans-serif" font-size="12" font-weight="800" fill="#0C4A6E">Neural Synthesis</text>
    <text x="56" y="42" font-family="'Work Sans', sans-serif" font-size="10" fill="#64748B">Instant Literature Review</text>

    <!-- Waveform / Spectrum -->
    <g transform="translate(20, 62)">
      <rect x="0" y="12" width="6" height="20" rx="3" fill="#38BDF8" />
      <rect x="12" y="4" width="6" height="28" rx="3" fill="#0284C7" />
      <rect x="24" y="16" width="6" height="16" rx="3" fill="#004AC1" />
      <rect x="36" y="0" width="6" height="32" rx="3" fill="#6366F1" />
      <rect x="48" y="8" width="6" height="24" rx="3" fill="#8B5CF6" />
      <rect x="60" y="18" width="6" height="14" rx="3" fill="#38BDF8" />
      <rect x="72" y="6" width="6" height="26" rx="3" fill="#0284C7" />
      <rect x="84" y="14" width="6" height="18" rx="3" fill="#004AC1" />
      <rect x="96" y="2" width="6" height="30" rx="3" fill="#6366F1" />
      <rect x="108" y="10" width="6" height="22" rx="3" fill="#8B5CF6" />
      <rect x="120" y="16" width="6" height="16" rx="3" fill="#0284C7" />
      <rect x="132" y="8" width="6" height="24" rx="3" fill="#38BDF8" />
      <rect x="144" y="14" width="6" height="18" rx="3" fill="#004AC1" />
      <rect x="156" y="4" width="6" height="28" rx="3" fill="#6366F1" />
    </g>

    <!-- Speed label -->
    <text x="105" y="118" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#0284C7" text-anchor="middle">Avg Latency: 1.2s</text>
  </g>

  <!-- CENTRAL HOLOGRAPHIC RESEARCH AGENT CORE -->
  <!-- Outer glowing aura -->
  <circle cx="400" cy="400" r="105" fill="#004AC1" opacity="0.08" filter="url(#shadow-core)" />
  <circle cx="400" cy="400" r="88" fill="#6366F1" opacity="0.12" filter="url(#shadow-core)" />
  
  <!-- Outer decorative polygon spinner ring -->
  <circle cx="400" cy="400" r="76" stroke="url(#cyan-blue)" stroke-width="3" stroke-dasharray="16 10 4 10" opacity="0.8" />
  <circle cx="400" cy="400" r="66" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.6" />

  <!-- Core Sphere / Hexagon Base -->
  <g filter="url(#shadow-card)">
    <!-- Hexagonal Core Gradient -->
    <polygon points="400,345 448,372 448,428 400,455 352,428 352,372" fill="url(#primary-grad)" />
    <!-- Hexagonal Inner Highlight -->
    <polygon points="400,352 440,376 440,424 400,448 360,424 360,376" fill="#00358E" opacity="0.4" />
    <polygon points="400,358 434,379 434,421 400,442 366,421 366,379" fill="url(#cyan-blue)" opacity="0.2" />

    <!-- Center Icon: Academic Book + AI Sparkle / Magnifier -->
    <g transform="translate(378, 378)" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <!-- Open Book glyph in pure vector -->
      <path d="M2 5 C2 4 3 3 4.5 3 H19 C20.5 3 22 4 22 5 V19 C22 18 20.5 17 19 17 H4.5 C3 17 2 18 2 19 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <path d="M42 5 C42 4 41 3 39.5 3 H25 C23.5 3 22 4 22 5 V19 C22 18 23.5 17 25 17 H39.5 C41 17 42 18 42 19 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
      <!-- AI Star Core inside book -->
      <path d="M22 6 L23.5 10.5 L28 12 L23.5 13.5 L22 18 L20.5 13.5 L16 12 L20.5 10.5 Z" fill="#FDE047" stroke="#FDE047" stroke-width="1" />
      <!-- Scientific analysis spark -->
      <circle cx="32" cy="9" r="2" fill="#38BDF8" stroke="none" />
      <circle cx="12" cy="9" r="2" fill="#38BDF8" stroke="none" />
    </g>
  </g>

  <!-- Glowing core pulse ring -->
  <circle cx="400" cy="400" r="54" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="8 12" />

  <!-- Center Floating Core Badge -->
  <g filter="url(#shadow-card)" transform="translate(325, 458)">
    <rect width="150" height="28" rx="14" fill="#0F172A" />
    <circle cx="340" cy="472" r="4" fill="#10B981" />
    <text x="406" y="476" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#F8FAFC" text-anchor="middle">RESEARCH AGENT AI</text>
  </g>

</svg>
